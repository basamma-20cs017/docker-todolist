version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: todo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  api:
    build: .
    container_name: todo-api
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/todos
      - PORT=3000
    depends_on:
      - mongo
    restart: always

volumes:
  mongo-data:
