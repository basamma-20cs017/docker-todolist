<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow – Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 2rem; font-weight: 700; }
    header p { color: var(--text-secondary); margin-top: 8px; }
    .input-section {
      display: flex; gap: 12px; margin-bottom: 32px;
      background: var(--card); padding: 16px; border-radius: 16px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    #todoInput {
      flex: 1; padding: 14px 18px; border: 1px solid var(--border);
      border-radius: 12px; font-size: 1rem; outline: none;
    }
    #todoInput:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
    #addBtn {
      background: var(--primary); color: white; border: none;
      padding: 0 24px; border-radius: 12px; font-weight: 600; cursor: pointer;
    }
    #addBtn:hover { background: var(--primary-hover); }
    .stats {
      display: flex; justify-content: space-between; margin-bottom: 20px;
      font-size: 0.875rem; color: var(--text-secondary);
    }
    #todoList { display: flex; flex-direction: column; gap: 12px; }
    .todo-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: var(--shadow);
    }
    .todo-left { display: flex; align-items: center; gap: 14px; flex: 1; }
    .checkbox {
      width: 22px; height: 22px; border: 2px solid var(--border);
      border-radius: 6px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .checkbox.checked { background: var(--success); border-color: var(--success); }
    .checkbox.checked::after { content: '✓'; color: white; font-weight: bold; }
    .todo-title.completed { text-decoration: line-through; color: var(--text-secondary); }
    .btn-icon {
      background: transparent; border: none; width: 36px; height: 36px;
      border-radius: 8px; cursor: pointer; font-size: 1.1rem;
    }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TaskFlow</h1>
      <p>Stay organized. Get things done.</p>
    </header>
    <div class="input-section">
      <input type="text" id="todoInput" placeholder="What needs to be done?" autocomplete="off">
      <button id="addBtn" onclick="addTodo()">+ Add Task</button>
    </div>
    <div class="stats">
      <span id="totalCount">0 tasks</span>
      <span id="completedCount">0 completed</span>
    </div>
    <div id="todoList">
      <div class="empty-state">Loading tasks...</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
